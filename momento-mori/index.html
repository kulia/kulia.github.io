<!DOCTYPE html>
<html lang="nb">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Memento Mori</title>
  <meta name="robots" content="noindex">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#EDE8DF">
  <link rel="canonical" href="https://kulia.no/momento-mori/">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-12XY9R26ZS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-12XY9R26ZS');
  </script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --parchment: #EDE8DF;
      --ink: #1E1C19;
      --warm: #3D3830;
      --muted: rgba(61, 56, 48, 0.48);
      --faint: rgba(61, 56, 48, 0.22);
      --ghost: rgba(61, 56, 48, 0.09);
      --gold: #8E7E5A;
      --gold-line: rgba(142, 126, 90, 0.30);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      font-family: 'EB Garamond', 'Times New Roman', serif;
      background: var(--parchment);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      overflow-x: hidden;
      cursor: default;
    }

    ::selection {
      background: rgba(142, 126, 90, 0.22);
    }

    /* Cotton paper grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* Soft vignette — gives the parchment physical depth */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9;
      background: radial-gradient(120% 95% at 50% 40%,
          rgba(255, 255, 255, 0) 45%,
          rgba(61, 56, 48, 0.05) 100%);
    }

    /* ── Engraved plate border ── */
    .frame {
      position: fixed;
      inset: 18px;
      z-index: 4;
      pointer-events: none;
      border: 1px solid rgba(61, 56, 48, 0.15);
      opacity: 0;
      animation: fade-in 1.8s 1.7s ease forwards;
    }

    .frame::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(142, 126, 90, 0.22);
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Page ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 4.5vh, 3.1rem);
      padding: clamp(2.4rem, 7vh, 4.5rem) clamp(1.4rem, 5vw, 3.5rem);
      width: 100%;
    }

    /* ── Title ── */
    .lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.9rem, 2.4vh, 1.5rem);
    }

    /* letter-spacing leaves a trailing space after the last glyph —
       compensate on the left so the optical centre matches the box centre */
    .title {
      font-size: clamp(1.15rem, 6vw, 3.8rem);
      font-weight: 500;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      white-space: nowrap;
      text-transform: uppercase;
      user-select: none;
      color: rgba(61, 56, 48, 0.28);
      text-shadow:
        -1px -1px 0px rgba(255, 255, 255, 0.70),
        1px 1px 0px rgba(61, 56, 48, 0.14),
        0px 1px 2px rgba(61, 56, 48, 0.06);
      opacity: 0;
      animation: rise 1.4s 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      animation: rise 1.4s 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .orn-line {
      width: clamp(28px, 9vw, 56px);
      height: 0;
      border-top: 1px solid var(--gold-line);
    }

    .orn-diamond {
      width: 4px;
      height: 4px;
      border: 1px solid var(--gold);
      opacity: 0.4;
      transform: rotate(45deg);
    }

    /* ── Trace ── */
    .trace {
      width: 100%;
      max-width: 900px;
      height: clamp(88px, 15vh, 132px);
      display: block;
      /* The trace is written at the right edge and ages leftward, dissolving
         back into the page. Only the trailing end fades: the pen has to write
         in clear air or there is nothing to watch. The sides are not
         interchangeable — time reads left to right, so mirroring this would
         draw every complex backwards, T before QRS before P. The ramp is a smoothstep
         rather than a straight line — a linear stop has a kink where it meets
         full opacity, and the eye reads that kink as an edge. */
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.000) 0.00%, rgba(0,0,0,0.104) 5.60%, rgba(0,0,0,0.352) 11.20%, rgba(0,0,0,0.500) 14.00%, rgba(0,0,0,0.648) 16.80%, rgba(0,0,0,0.896) 22.40%, rgba(0,0,0,1.000) 28.00%, rgba(0,0,0,1.000) 100%);
      mask-image: linear-gradient(to right, rgba(0,0,0,0.000) 0.00%, rgba(0,0,0,0.104) 5.60%, rgba(0,0,0,0.352) 11.20%, rgba(0,0,0,0.500) 14.00%, rgba(0,0,0,0.648) 16.80%, rgba(0,0,0,0.896) 22.40%, rgba(0,0,0,1.000) 28.00%, rgba(0,0,0,1.000) 100%);
      opacity: 0;
      animation: rise 1.4s 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ── Count ── */
    .count {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.7rem, 1.8vh, 1.1rem);
    }

    .count-figure {
      font-size: clamp(2rem, 10.5vw, 5.2rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.04em;
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: 'lnum', 'tnum';
      color: rgba(61, 56, 48, 0.62);
      text-shadow:
        -1px -1px 0px rgba(255, 255, 255, 0.55),
        1px 1px 0px rgba(61, 56, 48, 0.10);
      white-space: nowrap;
    }

    .count-label {
      font-size: clamp(0.58rem, 1.4vw, 0.75rem);
      font-weight: 500;
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      text-transform: uppercase;
      user-select: none;
      color: rgba(61, 56, 48, 0.34);
      text-shadow:
        -0.7px -0.7px 0px rgba(255, 255, 255, 0.60),
        0.7px 0.7px 0px rgba(61, 56, 48, 0.10);
    }

    /* ── Footer ── */
    footer {
      padding: 0 1.4rem clamp(1.6rem, 4.5vh, 3rem);
      text-align: center;
      opacity: 0;
      animation: rise 1.4s 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .footer-legal {
      font-size: 0.5625rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: rgba(61, 56, 48, 0.22);
      text-transform: uppercase;
    }

    /* Quieter than the legal line — a dedication, not a statement */
    .footer-hommage {
      margin-top: 0.5rem;
      font-size: 0.5rem;
      font-style: italic;
      letter-spacing: 0.14em;
      color: rgba(61, 56, 48, 0.15);
    }

    @media (max-width: 640px) {
      .frame {
        inset: 12px;
      }

      .frame::before {
        inset: 3px;
      }

      .ornament {
        gap: 0.75rem;
      }
    }

    /* Landscape phones: the plate has to hold everything without scrolling */
    @media (max-height: 520px) {
      .stage {
        gap: 0.9rem;
        padding: 1.1rem clamp(1.4rem, 5vw, 3.5rem);
      }

      .lockup {
        gap: 0.7rem;
      }

      .title {
        font-size: clamp(1.15rem, 5vw, 2.4rem);
      }

      .trace {
        height: 58px;
      }

      .count {
        gap: 0.6rem;
      }

      .count-figure {
        font-size: clamp(1.9rem, 8vw, 3.4rem);
      }

      footer {
        padding-bottom: 0.5rem;
      }

      .footer-hommage {
        margin-top: 0.25rem;
      }
    }

    @media (max-width: 420px) {
      .title {
        letter-spacing: 0.2em;
        padding-left: 0.2em;
      }

      .count-label {
        letter-spacing: 0.24em;
        padding-left: 0.24em;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .frame,
      .title,
      .ornament,
      .trace,
      .count,
      footer {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <!--

        ᛗ ᛖ ᛗ ᛖ ᚾ ᛏ ᛟ   ᛗ ᛟ ᚱ ᛁ

        56 slag, målt. Rytmen er min egen —
        skalert til 68 i minuttet.

        OPAŁKA 1965 / 1 – ∞

        Roman Opałka malte tallene fra 1 mot uendelig i 46 år, og blandet
        1 % mer hvitt i bunnen for hvert lerret, slik at sifrene nærmet seg
        hvitt på hvitt — «blanc mérité», den fortjente hvitheten. Han rakk
        til 5 607 249. Denne siden teller andre veien, og blekket følger
        samme bue: tallet står i den andelen av livet som ennå ikke er brukt.

  -->

  <div class="frame" aria-hidden="true"></div>

  <div class="page">

    <div class="stage">

      <div class="lockup">
        <h1 class="title">Memento Mori</h1>
        <div class="ornament" aria-hidden="true">
          <div class="orn-line"></div>
          <div class="orn-diamond"></div>
          <div class="orn-line"></div>
        </div>
      </div>

      <canvas class="trace" id="trace" aria-hidden="true"></canvas>

      <div class="count">
        <div class="count-figure" id="count">&nbsp;</div>
        <div class="count-label">Hjerteslag igjen</div>
      </div>

    </div>

    <footer>
      <div class="footer-legal">MCMXCI &mdash; MMLXXVII</div>
      <div class="footer-hommage">Etter Opa&#322;ka &middot; 1965 / 1 &ndash; &infin;</div>
    </footer>

  </div>

  <script>
    (function () {
      'use strict';

      // ── Constants ──────────────────────────────────────────────
      const BIRTH = [1991, 11, 11];   // year, month, day
      const LIFESPAN_YEARS = 86;      // → MMLXXVII
      const BPM = 68;                 // the rhythm below is scaled to this mean

      // 56 consecutive RR intervals (seconds), measured. Mean ≈ 0.52 s
      // (≈115 bpm); scaled below so the mean lands on BPM while the
      // beat-to-beat variability stays exactly as it was recorded.
      const RR_MEASURED = [
        0.5586, 0.5469, 0.5293, 0.5332, 0.5352, 0.5352, 0.5391, 0.5371,
        0.5313, 0.5215, 0.5137, 0.5117, 0.5078, 0.5020, 0.5020, 0.5020,
        0.5020, 0.5039, 0.5020, 0.5020, 0.4980, 0.5000, 0.5020, 0.5039,
        0.5117, 0.5176, 0.5176, 0.5137, 0.5078, 0.5078, 0.5039, 0.5078,
        0.5156, 0.5313, 0.5293, 0.5254, 0.5234, 0.5234, 0.5215, 0.5254,
        0.5254, 0.5176, 0.5098, 0.5059, 0.5039, 0.5020, 0.5039, 0.5234,
        0.5371, 0.5391, 0.5254, 0.5371, 0.5469, 0.5215, 0.5234, 0.5176
      ];

      const beatPeriodMs = 60000 / BPM;
      const meanMeasured = RR_MEASURED.reduce((a, b) => a + b, 0) / RR_MEASURED.length;
      const stretch = (beatPeriodMs / 1000) / meanMeasured;

      // Beat schedule: intervals in ms, plus cumulative onsets for lookup.
      const RR = RR_MEASURED.map(s => s * stretch * 1000);
      const ONSET = [0];
      for (let i = 0; i < RR.length; i++) ONSET.push(ONSET[i] + RR[i]);
      const cycleMs = ONSET[RR.length];

      // ── Waveform ───────────────────────────────────────────────
      // Normal sinus rhythm, lead II, in millivolts, measured in ms from the
      // onset of the P wave. Defined in absolute time rather than as a
      // fraction of the interval, so the complexes hold their shape and only
      // the diastolic baseline stretches — which is how a real interval varies.
      //
      // Every width here is a clinical duration, not a guess. The R wave gets
      // a sigma wide enough to give its limbs a real slope: too narrow and the
      // QRS collapses into a seismograph needle instead of a heartbeat.
      //   P       0 - 100 ms   apex  48    +0.12 mV   (two atrial components)
      //   PR seg 100 - 161      isoelectric   (PR interval 161 ms)
      //   QRS    161 - 250      89 ms total   q -0.10 / R +1.20 / S -0.25
      //   ST seg 250 - 360      isoelectric   (J point at 250 ms)
      //   T      360 - 540      apex 470     +0.30 mV, rise 110 / fall 70
      //   U      530 - 690      apex 610     +0.035 mV
      //   QT = 375 ms, QTc (Bazett) = 399 ms
      //
      // No sigma here is guessed. A Gaussian's full width at a tenth of its
      // peak is 4.292 sigma, and a tenth of peak is about where a caliper
      // judges a deflection to have left the baseline — so every sigma is
      // simply the clinical duration over 4.292. Waves that are asymmetric in
      // life get two sigmas, one per limb.
      const R_OFFSET = 196;   // ms from beat onset to the R peak
      const R_MV = 1.20;      // R amplitude — the vertical scale reference
      const S_MV = 0.25;      // S depth, needed to size the complex

      function ecgMv(ms) {
        if (ms > 800) return 0;               // diastole: a genuine flat line
        const g = (c, w, a) => a * Math.exp(-((ms - c) * (ms - c)) / (2 * w * w));
        // Two-sided: sigma differs either side of the apex.
        const g2 = (c, wl, wr, a) => g(c, ms < c ? wl : wr, a);
        return g(38.7, 19.89, 0.0734)         // P, right atrium
          + g(60.7, 21.02, 0.0650)            // P, left atrium — a rounded,
                                              //    slightly late-peaking dome
          + g(170, 5.126, -0.1242)            // q, septal
          + g(196, 9.553, 1.2002)             // R, 41 ms wide: a real limb slope
          + g2(224, 7.456, 12.116, -0.2621)   // S — fast down, slower J-point return
          + g2(470, 51.259, 32.619, 0.30)     // T — leans forward, drops away.
                                              //    A symmetric T is the tell.
          + g(610, 37.279, 0.035);            // U, the faintest thing on the page
      }

      // Index of the beat covering time t. The schedule loops, so the index
      // keeps climbing across repeats — that is what makes it a clock.
      function beatIndexAt(t) {
        const loops = Math.floor(t / cycleMs);
        const rem = t - loops * cycleMs;
        let lo = 0, hi = RR.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (ONSET[mid] <= rem) lo = mid; else hi = mid - 1;
        }
        return loops * RR.length + lo;
      }

      // ms since the most recent beat onset, for any point in time
      function sinceOnset(t) {
        const loops = Math.floor(t / cycleMs);
        const rem = t - loops * cycleMs;
        let lo = 0, hi = RR.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (ONSET[mid] <= rem) lo = mid; else hi = mid - 1;
        }
        return rem - ONSET[lo];
      }

      // ── Canvas ─────────────────────────────────────────────────
      const canvas = document.getElementById('trace');
      const ctx = canvas.getContext('2d');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w = 0, h = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.getBoundingClientRect();
        w = Math.max(1, Math.round(rect.width));
        h = Math.max(1, Math.round(rect.height));
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // A paper recorder has two settings: how fast the paper runs and how
      // hard the pen swings. Clinical values are 25 mm/s and 10 mm/mV, which
      // put the QRS width-to-height ratio near 1:5 — and that ratio is what
      // reads as a heartbeat. Below it the complex collapses into a needle.
      // Paper speed is fixed rather than derived from the canvas, so the
      // rhythm crosses the page at the same pace on every screen.
      const PX_PER_SEC = 125;    // paper speed — 25 mm/s at 5 px/mm
      const FADE = 0.28;         // width of the trailing dissolve

      function draw(now) {
        ctx.clearRect(0, 0, w, h);

        // The one identity that keeps the complex the right shape: a 10 mm/mV
        // gain over a 25 mm/s paper speed means 1 mV occupies 0.4 s of paper.
        // Deriving the gain from the speed instead of setting it independently
        // pins the QRS width-to-height ratio at the real 1:5.4 and holds it at
        // every canvas size. Never squeeze time to shrink the wave — squeezing
        // time is precisely what turns a heartbeat into a needle.
        const mvToPx = Math.min(
          0.4 * PX_PER_SEC,                  // clinical gain
          h * 0.80 / (R_MV + S_MV)           // ...unless the canvas is shorter
        );
        const windowMs = w / PX_PER_SEC * 1000;
        // Sit the baseline so the R peak above it and the S trough below it
        // straddle the middle of the canvas — otherwise the strip carries a
        // band of dead paper underneath and opens a gap in the page.
        const base = h / 2 + (R_MV - S_MV) / 2 * mvToPx;
        const dt = Math.min(1.5, Math.max(0.6, windowMs / w / 4));

        // Fading the ink is not enough on its own: a complex caught at the
        // margin still stands at full height and reads as a crop. So the
        // deflection is tapered away over the same span the ink fades across,
        // so the trace settles to a flat line before it disappears. Trailing
        // end only — at the pen, a complex cut mid-stroke is what a pen does.
        const points = [];
        for (let t = now - windowMs; t <= now; t += dt) {
          const x = w - (now - t) / windowMs * w;
          const e = Math.min(1, x / (w * FADE));
          const taper = e * e * (3 - 2 * e);
          points.push(x, base - ecgMv(sinceOnset(t)) * mvToPx * taper);
        }

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Letterpress: a white impression up-left, then the ink on top.
        const passes = [
          { dx: -0.7, dy: -0.7, style: 'rgba(255,255,255,0.45)', width: 1.5 },
          { dx: 0, dy: 0, style: 'rgba(61,56,48,0.70)', width: 1.45 }
        ];
        for (let p = 0; p < passes.length; p++) {
          const pass = passes[p];
          ctx.strokeStyle = pass.style;
          ctx.lineWidth = pass.width;
          ctx.beginPath();
          ctx.moveTo(points[0] + pass.dx, points[1] + pass.dy);
          for (let i = 2; i < points.length; i += 2) {
            ctx.lineTo(points[i] + pass.dx, points[i + 1] + pass.dy);
          }
          ctx.stroke();
        }

        // The pen. It sits at the live end and rides the waveform, so it is
        // the one thing here that moves the way a heart does.
        const nx = points[points.length - 2] - 0.8;
        const ny = points[points.length - 1];
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.arc(nx - 1.2, ny - 1.2, 2.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(61,56,48,0.88)';
        ctx.beginPath();
        ctx.arc(nx, ny, 2.1, 0, Math.PI * 2);
        ctx.fill();
      }

      // ── Count ──────────────────────────────────────────────────
      const countEl = document.getElementById('count');
      const deathTime = new Date(BIRTH[0] + LIFESPAN_YEARS, BIRTH[1] - 1, BIRTH[2]).getTime();

      function beatsLeft() {
        return Math.floor(Math.max(0, deathTime - Date.now()) / beatPeriodMs);
      }

      // ── Blanc mérité ───────────────────────────────────────────
      // After Opałka: the ink is mixed with the proportion of the life still
      // unspent, so the figure pales as the number falls. Calibrated so that
      // the arc runs from 0.90 at birth to 0.20 at the end — a drift far too
      // slow to catch in one sitting, which was rather his point.
      const bornTime = new Date(BIRTH[0], BIRTH[1] - 1, BIRTH[2]).getTime();
      const unspent = Math.min(1, Math.max(0,
        (deathTime - Date.now()) / (deathTime - bornTime)));
      countEl.style.color = 'rgba(61, 56, 48, ' + (0.20 + 0.70 * unspent).toFixed(3) + ')';

      let remaining = beatsLeft();
      let shown = -1;
      function paint() {
        if (remaining === shown) return;
        shown = remaining;
        countEl.textContent = remaining.toLocaleString('nb-NO')
          .replace(/[\s\u00a0\u202f]/g, '\u2009');
      }
      paint();

      // The figure drops as the R spike reaches the nib, not on a
      // wall-clock tick — so the number and the pen agree. Counting the
      // beats actually drawn, rather than re-reading the clock each time,
      // is what holds it to exactly one per beat: the intervals vary, the
      // clock does not, and the difference would show as a stutter.
      let lastStrike = null;
      function strike(now) {
        const struck = beatIndexAt(now - R_OFFSET);
        if (struck === lastStrike) return;
        const first = lastStrike === null;
        lastStrike = struck;
        if (first) return;

        remaining = Math.max(0, remaining - 1);
        // rAF sleeps while the tab is hidden; the clock does not.
        const truth = beatsLeft();
        if (Math.abs(remaining - truth) > 2) remaining = truth;
        paint();
      }

      // ── Loop ───────────────────────────────────────────────────
      resize();
      if (window.ResizeObserver) {
        new ResizeObserver(function () {
          resize();
          if (reducedMotion) draw(cycleMs);
        }).observe(canvas);
      } else {
        window.addEventListener('resize', function () {
          resize();
          if (reducedMotion) draw(cycleMs);
        });
      }

      if (reducedMotion) {
        // A printed strip: no sweep, but the count still counts.
        draw(cycleMs);
        setInterval(function () { remaining = beatsLeft(); paint(); }, 250);
        return;
      }

      function frame() {
        const now = performance.now();
        draw(now);
        strike(now);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>

</body>
